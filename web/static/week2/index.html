<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายการสินค้า</title>

  <link rel="stylesheet" href="styles.css">

</head>

<body>

  <header>
    <nav>
      <a href="/week2/index.html">สินค้า</a>
      <a href="/week2/cart.html">ตะกร้าตัวอย่าง</a>
    </nav>
  </header>

  <main>
    <h1>รายการสินค้า</h1>

    <section id="catalog">
      <article>
        <h2>Notebook</h2>
        <p>สินค้า Notebook</p>
      </article>

      <article>
        <h2>Pen</h2>
        <p>สินค้า Pen</p>
      </article>

    </section>

    <form class="interest-form" action="/week2/index.html" method="GET">
      <div class="field">
        <label for="productId">สินค้าที่สนใจ</label>
        <select id="productId" name="productId" required>
          <option value="">เลือกสินค้า</option>
          <option value="notebook">Notebook</option>
          <option value="pen">Pen</option>
        </select>
      </div>

      <div class="field">
        <label for="quantity">จำนวนที่สนใจ</label>
        <input
          type="number"
          id="quantity"
          name="quantity"
          min="1"
          required
        >
      </div>

      <button type="submit">ทดลองส่งข้อมูล</button>
      <button type="reset">คืนค่าเริ่มต้น</button>
    </form>

    <a class="restart-link" href="/week2/index.html">เริ่มตัวอย่างใหม่</a>
  </main>

</body>
</html>
